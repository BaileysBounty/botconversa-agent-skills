name: Validate skills

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/scan_public_content.py --self-test
      - run: python3 scripts/scan_public_content.py
      - run: python3 scripts/validate_pack.py
      - run: bash -n install.sh uninstall.sh
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"
      - name: Smoke install and uninstall
        run: |
          test_root="$(mktemp -d)"
          test_dest="$test_root/skills"
          BOTCONVERSA_ALLOW_UNRELEASED=1 BOTCONVERSA_SKILLS_DEST="$test_dest" ./install.sh
          BOTCONVERSA_ALLOW_UNRELEASED=1 BOTCONVERSA_SKILLS_DEST="$test_dest" ./install.sh
          test "$(find "$test_dest" -mindepth 1 -maxdepth 1 -type l | wc -l | tr -d ' ')" = "3"
          BOTCONVERSA_SKILLS_DEST="$test_dest" ./uninstall.sh
          BOTCONVERSA_SKILLS_DEST="$test_dest" ./uninstall.sh
          test -z "$(find "$test_dest" -mindepth 1 -maxdepth 1 -print -quit)"
